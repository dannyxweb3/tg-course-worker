# tg-course-worker 管理后台的 nginx 反向代理。
#
# 用之前把 admin.example.com 全部换成你自己的域名，
# 并且**先**用 certbot 签好证书（见 deploy/README.md），否则 nginx 起不来。
#
# 应用本身仍然只绑 127.0.0.1:8080，不要改 .env 里的 WEB_HOST。
# 对外的暴露面完全由这个文件控制。

# 登录接口限流。后台是单密码、没有验证码、没有失败锁定，
# 一旦对公网开放，这里就是唯一一道防暴力破解的闸。
# 10 次/分钟对人来说绰绰有余，对脚本来说没意义。
limit_req_zone $binary_remote_addr zone=tcw_login:10m rate=10r/m;

server {
    listen      80;
    listen      [::]:80;
    server_name admin.example.com;

    # 留给 certbot 续期时的 HTTP-01 验证，其余一律跳 HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location /                            { return 301 https://$host$request_uri; }
}

server {
    # 老写法，nginx 1.18 ~ 1.24（Ubuntu 22.04 / 24.04 自带的版本）都认。
    # nginx 1.25.1+ 会提示这个写法已弃用，那时改成下面两行：
    #     listen 443 ssl;
    #     http2  on;
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;

    # TLS 参数写在这里，不去 include certbot 的 options-ssl-nginx.conf：
    # 用 certonly 签证书时那个文件不一定存在，include 一个不存在的文件
    # 会让 nginx -t 直接失败，而报错信息指向的是"少了个文件"，很难联想到签证书方式。
    # 只用 ECDHE 套件，所以也不需要 ssl_dhparam。
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS 开之前先确认证书自动续期是通的：证书一过期，
    # 浏览器连"继续访问"的选项都不会给你。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    nosniff            always;
    add_header X-Frame-Options           DENY               always;
    add_header Referrer-Policy           no-referrer        always;

    # 录入素材可以传 10MB 的 PDF。nginx 默认上限是 1MB，
    # 不放宽的话上传会直接 413，而且错误信息在前端很难看懂。
    client_max_body_size 12m;

    access_log /var/log/nginx/tg-course-worker.access.log;
    error_log  /var/log/nginx/tg-course-worker.error.log;

    # ---- 代理参数写在 server 层，下面的 location 继承 ----
    # 注意：某个 location 里只要写了一条 proxy_set_header，
    # 继承来的其它 header 就全没了，要写就得全写一遍。
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 后台的"重新生成""按意见重写""生成全文页"都是在请求里同步跑 LLM 的，
    # 一次二三十秒起，慢的时候更久。nginx 默认 60 秒就 504 了。
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ---- 可选：只放行你自己的出口 IP ----
    # 加上这几行，等于在密码之外再加一层网络层过滤。
    # 家宽 IP 会变，用之前想清楚被关在门外时怎么办（还有 SSH 隧道兜底）。
    # allow 203.0.113.10;
    # allow 198.51.100.0/24;
    # deny  all;

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /login {
        limit_req      zone=tcw_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass     http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
